[project]
name = "lake-rise-model"
version = "0.1.0"
description = "Crystal Lake dam lake-rise prediction (HSPF interflow bucket model)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyarrow>=15.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lake-rise = "lake_rise.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_rise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
