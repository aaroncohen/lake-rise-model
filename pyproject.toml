[project]
name = "lake-rise-model"
version = "0.1.0"
description = "Crystal Lake dam lake-rise prediction (HSPF interflow bucket model)"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyarrow>=15.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Alerting layer. Pinned to vetted releases (latest official PyPI build that
    # was >= 7 days old when pinned, per the supply-chain guard in the plan):
    #   apscheduler 3.11.3 (2026-06-28, agronholm/apscheduler)
    #   jinja2      3.1.6  (2025-03-05, pallets/jinja)
    #   twilio      9.13.0 (2026-11-06, twilio/twilio-python)
    "apscheduler==3.11.3",
    "jinja2==3.1.6",
    "twilio==9.13.0",
    # Ensemble rain forecasts (NBM / ECMWF GRIB2). The wheels bundle ecCodes, so no system
    # library is needed in the slim image:
    #   pygrib      2.1.8  (2025-10-26, jswhit/pygrib)
    "pygrib==2.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "aiosmtpd>=1.4",   # local catch-all SMTP server for the email smoke test
    "playwright>=1.64,<2",   # the field page at phone width (tests/test_field_page.py)
]

[project.scripts]
lake-rise = "lake_rise.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_rise"]
# Ship non-Python assets (UI page + alert notice templates) inside the wheel/image.
artifacts = [
    "src/lake_rise/static/*",
    "src/lake_rise/alerting/templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Supply-chain guard: resolve only releases at least 7 days old (uv.lock records the result).
exclude-newer = "7 days"
