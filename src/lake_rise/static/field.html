<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Lake</title>
<style>
  :root {
    --page: #F4F4F1; --card: #FFFFFF; --border: #E2E1DA; --grid: #E2E1DA; --axis: #C9C8BF;
    --text: #121212; --muted: #55544E; --btn-border: #D5D4CC;
    --t-warning: #6B5200; --t-plastic: #9A3412; --t-red: #7A1712; --t-red-card: #7A1712;
    --ok: #165C16; --flag-bg: #FDF1D6; --flag-text: #6B5200; --tag-bg: #ECEBE5;
    --banner-bg: #FDF1D6; --banner-text: #6B5200; --stick-bg: #FFFFFF; --dot-none: #1F5FB8;
    --act-tag-bg: #FDEBD8; --bar-up: #1F5FB8; --bar-down: #9A3412; --rain: #1F5FB8;
    --water: #1F6FD1; --band-outer: 0.16; --band-inner: 0.30; --band-single: 0.20;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #121212; --card: #1C1C1A; --border: #33322E; --grid: #3A3936; --axis: #4A4944;
      --text: #F0EFEC; --muted: #C3C2B7; --btn-border: #4A4944;
      --t-warning: #E0B84A; --t-plastic: #F59E6B;
      --t-red-card: #F28B82;   /* an overtop label off the pink zones, on the dark card: 7:1 */
      --ok: #7FCF7F; --flag-bg: #3A2F0F; --flag-text: #F2D27A; --tag-bg: #2C2B28;
      --banner-bg: #3A2F0F; --banner-text: #F2D27A; --stick-bg: #1C1C1A; --act-tag-bg: #3A2414; --bar-up: #4C8BE0; --bar-down: #F59E6B;
      --rain: #4C8BE0;
      /* The light-scheme blue at 16-30% all but vanishes on the dark card; lighter and stronger here. */
      --water: #4C8BE0; --band-outer: 0.40; --band-inner: 0.70; --band-single: 0.50;
      --dot-none: #4C8BE0;   /* #1F5FB8 is 2.7:1 on the dark card; this is 4.9:1 */
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
         font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
           background: var(--card); border-bottom: 1px solid var(--border); color: var(--text); }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; }
  header .when { font-size: 14px; color: var(--muted); }
  header .title { display: flex; align-items: baseline; gap: 8px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--btn-border);
              background: var(--card); color: var(--text); display: flex; align-items: center;
              justify-content: center; cursor: pointer; padding: 0; }
  .icon-btn[aria-busy="true"] svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { display: flex; flex-direction: column; gap: 12px; }
  .card { margin: 0 16px; background: var(--card); color: var(--text); border: 1px solid var(--border);
          border-radius: 16px; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .banner { margin: 0 16px; padding: 10px 14px; border-radius: 12px; background: var(--banner-bg);
            color: var(--banner-text); font-size: 15px; font-weight: 600; }
  .status { margin: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .status-row { border-radius: 14px; color: #FFFFFF; padding: 12px 16px; display: flex;
                align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .status-row .lead { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; letter-spacing: 0.4px; }
  .status-row .head { font-size: 18px; font-weight: 700; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px; flex-wrap: wrap; }
  .caps { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .now { font-size: 40px; font-weight: 800; line-height: 1; }
  .trend { display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; color: var(--muted); }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
  .tag.ok { color: var(--ok); }
  .rain-total { font-size: 14px; font-weight: 700; }
  .rain-total .muted { font-weight: 500; color: var(--muted); }
  .tag.rain { color: var(--rain); }
  .tags-now { display: flex; align-items: center; gap: 12px; }
  .tag.grey { padding: 4px 10px; border-radius: 8px; background: var(--tag-bg); color: var(--text); }
  .flag { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px;
          background: var(--flag-bg); color: var(--flag-text); font-size: 14px; font-weight: 600; }
  .peak { display: flex; align-items: baseline; justify-content: space-between; border-top: 1px solid var(--grid);
          padding: 12px 4px 0; }
  .peak .k { font-size: 15px; color: var(--muted); }
  .peak .v { font-size: 20px; font-weight: 700; }
  .peak .v span { font-size: 15px; font-weight: 500; color: var(--muted); }
  .key { display: flex; align-items: center; gap: 6px; padding: 0 4px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .key b { color: var(--text); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  svg.chart { display: block; width: 100%; height: auto; }
  svg text { font-family: inherit; }
  .t-muted { fill: var(--muted); }
  .t-text { fill: var(--text); }
  .s-text { stroke: var(--text); }
  .f-text { fill: var(--text); }
  .f-water { fill: var(--water); }
  .s-water { stroke: var(--water); }
  .band-outer { fill-opacity: var(--band-outer); }
  .band-inner { fill-opacity: var(--band-inner); }
  .band-single { fill-opacity: var(--band-single); }
  .stick-body { fill: var(--stick-bg); stroke: var(--text); }
  .s-grid { stroke: var(--grid); }
  .s-axis { stroke: var(--axis); }
  .z-early_warning { fill: var(--t-warning); }
  .z-eap_plastic { fill: var(--t-plastic); }
  .z-overtop, .z-bridge { fill: var(--t-red); }
  .dot-none { fill: var(--dot-none); color: var(--dot-none); }
  /* Labels keep a halo of their background so a crowded dot row can't hide them. */
  .halo { paint-order: stroke; stroke: var(--card); stroke-width: 3px; stroke-linejoin: round; }
  .halo.z-overtop, .halo.z-bridge { stroke: #F9DDD9; }
  .halo.z-overtop.on-card { stroke: var(--card); fill: var(--t-red-card); }
  .act { display: flex; align-items: center; gap: 12px; padding: 0 4px; font-size: 17px; font-weight: 600; }
  .act svg { flex: none; color: var(--t-plastic); }
  .next { border-top: 1px solid var(--grid); padding: 10px 4px 0; display: flex; flex-direction: column; gap: 8px; }
  .next-h { font-size: 14px; font-weight: 700; color: var(--t-plastic); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .act-tag { padding: 6px 10px; border-radius: 8px; background: var(--act-tag-bg); color: var(--text); font-size: 14px; font-weight: 600; }
  .sl-h { font-size: 14px; font-weight: 700; padding: 0 4px; }
  .err-title { font-size: 18px; font-weight: 700; padding: 0 4px; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--btn-border);
         background: var(--card); color: var(--text); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; align-self: flex-start; }
  .details { margin: 0 16px; display: flex; align-items: center; justify-content: space-between; min-height: 52px;
             padding: 0 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--btn-border);
             color: var(--text); font-size: 16px; font-weight: 600; text-decoration: none;
             width: calc(100% - 32px); font-family: inherit; cursor: pointer; }
  .details-top { margin: 0 16px; display: flex; align-items: center; gap: 12px; }
  .details-top h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .back { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--btn-border);
          background: var(--card); color: var(--text); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  .sec { margin: 0 16px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .sec-h { width: 100%; min-height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
           background: transparent; color: var(--text); border: 0; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; text-align: left; }
  .sec-h svg { flex: none; }
  .sec-h[aria-expanded="true"] svg { transform: rotate(90deg); }
  .sec-b { padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
  .sec-b[hidden] { display: none; }
  .fwin { font-size: 14px; color: var(--muted); }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; align-items: center; }
  .frow .lab { grid-column: 1 / -1; display: flex; justify-content: space-between; font-weight: 600; }
  .bar { position: relative; height: 12px; background: var(--tag-bg); border-radius: 6px; grid-column: 1 / -1; }
  .bar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--axis); }
  .bar i { position: absolute; top: 0; bottom: 0; background: var(--bar-up); }
  .bar i.neg { background: var(--bar-down); }
  .net { display: flex; justify-content: space-between; border-top: 1px solid var(--grid); padding-top: 8px; font-weight: 700; }
  table.d { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.d caption { text-align: left; color: var(--muted); padding-bottom: 4px; }
  table.d th, table.d td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--grid); }
  table.d th:first-child, table.d td:first-child { text-align: left; }
  table.d th { font-weight: 700; }
  .drow { display: flex; justify-content: space-between; gap: 12px; }
  .tool { margin: 0 16px; display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-radius: 14px;
          background: var(--card); border: 1px solid var(--btn-border); color: var(--text); font-size: 16px; font-weight: 600; text-decoration: none; }
  #details-view { display: flex; flex-direction: column; gap: 12px; }
  main[hidden], .details[hidden], #details-view[hidden] { display: none; }
  .banner.example { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 14px; }
  .banner.example .sub { display: block; font-size: 14px; font-weight: 500; }
  .banner.example a { flex: none; min-height: 44px; padding: 0 14px; border: 1px solid currentColor; border-radius: 10px;
                      display: inline-flex; align-items: center; color: inherit; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <header data-testid="header">
    <div class="title"><h1>Crystal Lake</h1><span class="when" id="updated"></span></div>
    <button type="button" class="icon-btn" data-testid="refresh" id="refresh" aria-label="Refresh">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>
  <main id="main" aria-live="polite"></main>
  <div id="details-view" data-testid="details-view" hidden></div>
  <button type="button" class="details" data-testid="details" id="details">Details
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>
<script>
'use strict';
const TZ = 'America/Los_Angeles';
const LADDER = { ADVISORY: '#8A6A00', WARNING: '#8A6A00', WATCH: '#B54708', DANGER: '#B42318',
                 CRITICAL: '#7A1712', EVACUATE: '#7A1712' };
const DOT = { early_warning: '#8A6A00', eap_plastic: '#C2410C', overtop: '#B42318', bridge: '#7A1712' };
const STICK_PX_PER_FT = 105;   // 0.1 ft rows sit ~10 px apart, clear of the 8.6 px dots
const ERRORS = { 502: "Can't reach the gauge", 503: 'No live data source' };

const main = document.getElementById('main');
const updated = document.getElementById('updated');
const refreshBtn = document.getElementById('refresh');
// /?example=storm shows the example storm (/field/example), for showing the page to people.
const EXAMPLE = new URLSearchParams(location.search).has('example');

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f2 = v => Number(v).toFixed(2);
const n1 = v => Number(v).toFixed(1);

function tzParts(date, opts) {
  const out = {};
  for (const p of new Intl.DateTimeFormat('en-US', { timeZone: TZ, ...opts }).formatToParts(date)) out[p.type] = p.value;
  return out;
}
const hm = d => { const p = tzParts(d, { hour: 'numeric', minute: '2-digit', hour12: true }); return `${p.hour}:${p.minute}`; };
const clock = d => { const p = tzParts(d, { hour: 'numeric', minute: '2-digit', hour12: true }); return `${p.hour}:${p.minute} ${p.dayPeriod.toLowerCase()}`; };
const dayHour = d => { const p = tzParts(d, { weekday: 'short', hour: 'numeric', hour12: true }); return `${p.weekday} ${p.hour}${p.dayPeriod[0].toLowerCase()}`; };

const ICON = {
  octagon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>',
  triangle: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>',
  up: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="rising"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>',
  down: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="falling"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>',
  boards: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M3 15h18"/></svg>',
  waves: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M2 18c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/></svg>',
  clock: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  alert: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  drop: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  flag: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/></svg>',
};

const byKey = levels => Object.fromEntries(levels.map(lv => [lv.key, lv]));
const levelText = lv => lv.reached ? `${lv.label} reached` : lv.pct == null ? lv.label : `${lv.label} ${lv.pct}%`;
const levelTop = lv => lv.band_top_ft ?? lv.stick_ft;   // a band's label sits above its upper edge
const ACTION_ICON = { pull_logs: 'boards', logs_out: 'boards', inspect: 'waves', monitor: 'clock' };
const actionIcon = id => ICON[id.startsWith('eap') ? 'alert' : ACTION_ICON[id]] || '';

// The danger zones between bot and top on a value scale y(), across [x0, x0 + w].
function zones(L, y, x0, w, top, bot) {
  const band = (hi, lo, fill, op) => {
    hi = Math.min(hi, top); lo = Math.max(lo, bot);
    return hi > lo ? `<rect x="${x0}" y="${y(hi).toFixed(1)}" width="${w}" height="${(y(lo) - y(hi)).toFixed(1)}" fill="${fill}" fill-opacity="${op}"/>` : '';
  };
  const line = (v, color, dash) => v > bot && v < top
    ? `<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x0 + w}" y2="${y(v).toFixed(1)}" stroke="${color}" stroke-width="2"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` : '';
  const ow = L.overtop, br = L.bridge;   // no bridge level when the artifact has no bridge deck
  // Solid colours, the same in both schemes: the label colours and halos are chosen against them.
  // (#D68680 is the red #B42318 at 55% on white; at 55% on the dark card it went near-black.)
  return (br ? band(top, br.band_top_ft, '#F3C9C4', 1)
      + band(br.band_top_ft, br.stick_ft, '#D68680', 1)
      + band(br.stick_ft, ow.band_top_ft, '#F9DDD9', 1)
    : band(top, ow.band_top_ft, '#F9DDD9', 1))
    + band(ow.band_top_ft, ow.stick_ft, '#D68680', 1)
    + line(L.eap_plastic.stick_ft, '#C2410C')
    + line(L.early_warning.stick_ft, '#8A6A00', '5 4');
}

// "Warning 2.63" for every zone in view: above its upper edge, else below its line, at the
// left (x0) or else the right (x1), wherever it clears the labels already placed.
// A label's box [x0, y0, x1, y1] from its anchor point, at about `cw` px per character.
const textBox = (text, x, y, anchor, cw) => {
  const w = text.length * cw, left = anchor === 'end' ? x - w : anchor === 'middle' ? x - w / 2 : x;
  return [left, y - 14, left + w, y + 5];   // the browser's text box, ascent to descent
};
const overlaps = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];

// `avoid`: boxes the zone labels must not cover (the timeline's peak label).
function zoneLabels(levels, y, x0, x1, h, top, bot, avoid = []) {
  const placed = [];
  let s = '';
  for (const lv of [...levels].reverse()) {
    if (lv.stick_ft <= bot || lv.stick_ft >= top) continue;
    const at = levelTop(lv), above = at < top && y(at) >= 14 ? y(at) - 4 : null, below = y(lv.stick_ft) + 13;
    const spots = [[x0, above], [x0, below], [x1, above], [x1, below]].filter(([, yy]) => yy != null && yy <= h);
    const text = `${lv.label} ${f2(lv.stick_ft)}`;
    const clear = (x, yy) => avoid.every(b => !overlaps(textBox(text, x, yy, x === x1 ? 'end' : 'start', 6.3), b));
    const [x, yy] = spots.find(([x, yy]) => clear(x, yy) && placed.every(([px, py]) => px !== x || Math.abs(py - yy) >= 12))
      || spots.find(([x, yy]) => clear(x, yy)) || spots[0] || [x0, below];
    placed.push([x, yy]);
    const onCard = lv.key === 'overtop' && yy > y(lv.stick_ft);   // below the line: off the pink zones
    s += `<text data-testid="zone-label" class="z-${lv.key} halo${onCard ? ' on-card' : ''}" x="${x}" y="${yy.toFixed(1)}" font-size="11" font-weight="600"${x === x1 ? ' text-anchor="end"' : ''}>${esc(lv.label)} ${f2(lv.stick_ft)}</text>`;
  }
  return s;
}

function stickSvg(d) {
  const fallback = d.mode === 'fallback';
  const L = byKey(d.levels), c = d.cases, now = d.lake.now_ft;
  const was = d.change ? d.change.middle_was_ft : null;
  const vals = [...(fallback ? [c.dry, c.wet] : d.peaks_ft), ...(was == null ? [] : [was])];
  const top = Math.max(5.5, Math.max(...vals, now) + 0.2);
  // 2.0 ft unless the lake or a peak sits lower, so no dot or water line falls off the stick.
  const bot = Math.min(2.0, Math.floor((Math.min(...vals, now) - 0.1) * 2) / 2);
  const W = 362, H = Math.round((top - bot) * STICK_PX_PER_FT + 16);
  const y = v => 8 + (top - v) * STICK_PX_PER_FT;
  let s = zones(L, y, 28, 330, top, bot);
  s += `<rect class="stick-body" x="30" y="8" width="22" height="${(y(bot) - 8).toFixed(1)}" stroke-width="1.5"/>`;
  if (now > bot) s += `<rect x="30" y="${y(Math.min(now, top)).toFixed(1)}" width="22" height="${(y(bot) - y(Math.min(now, top))).toFixed(1)}" class="f-water"/>`;
  for (let t = Math.ceil(bot * 10); t <= Math.floor(top * 10); t++) {
    const v = t / 10, yy = y(v).toFixed(1), len = t % 10 === 0 ? 22 : t % 5 === 0 ? 13.2 : 7.7;
    s += `<line class="s-text" x1="30" y1="${yy}" x2="${30 + len}" y2="${yy}" stroke-width="${t % 10 === 0 ? 1.5 : 1}"/>`;
    if (t % 10 === 0) s += `<text class="t-muted" x="24" y="${(y(v) + 4).toFixed(1)}" font-size="12" text-anchor="end">${t / 10}</text>`;
  }
  if (fallback) {
    s += `<rect data-testid="range-bar" x="64" y="${y(c.wet).toFixed(1)}" width="20" height="${Math.max(2, y(c.dry) - y(c.wet)).toFixed(1)}" rx="4" class="f-water" fill-opacity="0.45"/>`;
    s += `<line class="s-text" x1="56" y1="${y(c.middle).toFixed(1)}" x2="92" y2="${y(c.middle).toFixed(1)}" stroke-width="3"/>`;
    s += `<text class="t-text" x="98" y="${(y(c.middle) + 4).toFixed(1)}" font-size="12" font-weight="700">middle ${f2(c.middle)}</text>`;
  } else {
    const rowOf = p => Math.floor(p * 10 + 1e-9) / 10;   // the epsilon keeps 2.3 * 10 from flooring to 22
    const size = new Map(), placed = new Map();
    for (const p of d.peaks_ft) size.set(rowOf(p), (size.get(rowOf(p)) || 0) + 1);
    d.peaks_ft.forEach((p, i) => {
      const row = rowOf(p), k = placed.get(row) || 0; placed.set(row, k + 1);
      const gap = Math.min(10, 290 / size.get(row));   // a crowded row (a quiet lake held high) squeezes to fit
      const lvl = DOT[d.peak_levels[i]];
      s += `<circle data-testid="peak-dot" cx="${(64 + gap * k).toFixed(1)}" cy="${y(row + 0.05).toFixed(1)}" r="4.3" ${lvl ? `fill="${lvl}"` : 'class="dot-none"'}/>`;
    });
    s += `<line class="s-text" x1="56" y1="${y(c.middle).toFixed(1)}" x2="140" y2="${y(c.middle).toFixed(1)}" stroke-width="2.5"/>`;
    s += `<text data-testid="middle-label" class="t-text halo" x="146" y="${(y(c.middle) + 4).toFixed(1)}" font-size="12" font-weight="700">middle ${f2(c.middle)}</text>`;
  }
  // The level labels keep clear of the middle and was labels (a middle case on a level's line).
  const taken = [textBox(`middle ${f2(c.middle)}`, fallback ? 98 : 146, y(c.middle) + 4, 'start', 7.2)];
  if (was != null) {
    // Dashed at the last forecast's middle; its label keeps clear of the middle's.
    const x2 = fallback ? 92 : 140, my = y(c.middle), wy = y(was);
    const ly = wy >= my ? Math.max(wy, my + 13) : Math.min(wy, my - 13);
    s += `<g data-testid="was-line"><line class="s-text" x1="56" y1="${wy.toFixed(1)}" x2="${x2}" y2="${wy.toFixed(1)}" stroke-width="1.5" stroke-dasharray="3 3"/>`
      + `<text class="t-muted halo" x="${x2 + 6}" y="${(ly + 4).toFixed(1)}" font-size="11">was ${f2(was)}</text></g>`;
    taken.push(textBox(`was ${f2(was)}`, x2 + 6, ly + 4, 'start', 6.3));
  }
  const pctWas = (d.change && d.change.pct_was) || {};
  for (const lv of d.levels) {
    const at = levelTop(lv);
    if (at <= bot || at >= top) continue;
    // Above its line, else below it, else just above or below the label in the way.
    const text = levelText(lv) + (pctWas[lv.key] != null ? ` (was ${pctWas[lv.key]}%)` : '');
    const clear = yy => taken.every(b => !overlaps(textBox(text, 354, yy, 'end', 7.4), b));
    const inWay = taken.find(b => !clear(y(at) - 6) && overlaps(textBox(text, 354, y(at) - 6, 'end', 7.4), b));
    const ly = [y(at) - 6, y(lv.stick_ft) + 17, ...(inWay ? [inWay[1] - 7, inWay[3] + 16] : [])].find(clear) ?? y(at) - 6;
    s += `<text data-testid="level-${lv.key}" class="z-${lv.key} halo" x="354" y="${ly.toFixed(1)}" font-size="13" font-weight="${lv.reached ? 800 : 600}" text-anchor="end">${esc(levelText(lv))}`
      + (pctWas[lv.key] != null ? `<tspan data-testid="level-was-${lv.key}"> (was ${pctWas[lv.key]}%)</tspan>` : '') + `</text>`;
  }
  const label = `Lake ${f2(now)} ft. ` + d.levels.map(levelText).join(', ') + `. Middle ${f2(c.middle)} ft.`
    + (was != null ? ` Was ${f2(was)} ft.` : '');
  return `<svg class="chart" data-testid="stick" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${s}</svg>`
    + (fallback ? '' : `<div class="key"><span class="dot-none">●</span> = one possible outcome, at its highest level</div>`);
}

function timelineSvg(d) {
  const t = d.timeline, n = t.middle_ft.length, now = d.lake.now_ft, L = byKey(d.levels);
  const ens = d.mode === 'ensemble';
  const all = [now, ...t.middle_ft, ...Object.values(t.bands).flat()];
  const pk = Math.max(...t.middle_ft), bot = Math.min(...all) - 0.15, W = 290, H = 170;
  let top = Math.max(...all, L.early_warning.stick_ft) + 0.15;
  // Headroom for the peak label above the peak: at least 22 px between them and the chart's top.
  const room = 22 / H;
  if ((top - pk) / (top - bot) < room) top = (pk - room * bot) / (1 - room);
  const x = h => h / n * W, y = v => (top - v) / (top - bot) * H;
  const pts = arr => [[0, now], ...arr.map((v, i) => [i + 1, v])];
  const xy = ([h, v]) => `${x(h).toFixed(1)},${y(v).toFixed(1)}`;
  const area = (lo, hi, band) => `<path data-testid="timeline-shade" d="M${[...pts(t.bands[hi]), ...pts(t.bands[lo]).reverse()].map(xy).join('L')}Z" class="f-water band-${band}"/>`;
  let g = zones(L, y, 0, W, top, bot);
  g += ens ? area('10', '90', 'outer') + area('25', '75', 'inner') : area('low', 'high', 'single');
  g += `<path data-testid="timeline-middle" class="s-text" d="M${pts(t.middle_ft).map(xy).join('L')}" fill="none" stroke-width="3" stroke-linejoin="round"/>`;
  g += `<circle class="f-text" cx="0" cy="${y(now).toFixed(1)}" r="5"/>`;
  g += `<line class="s-axis" x1="0" y1="${H}" x2="${W}" y2="${H}" stroke-width="1"/>`;
  let outer = '';
  const start = Date.parse(t.start);
  outer += `<text class="t-text" x="34" y="196" font-size="12" font-weight="600">Now</text>`;
  for (let h = 24; h <= n; h += 24) {
    g += `<line class="s-grid" x1="${x(h).toFixed(1)}" y1="0" x2="${x(h).toFixed(1)}" y2="${H}" stroke-width="1"/>`;
    outer += `<text class="t-muted" x="${(34 + x(h)).toFixed(1)}" y="196" font-size="12" text-anchor="${h === n ? 'end' : 'middle'}">${dayHour(new Date(start + h * 3600e3))}</text>`;
  }
  // The middle case's peak, marked and labelled; a lake that only falls peaks at now, labelled already.
  // Placed before the zone labels, which then move out of its way.
  const ip = t.middle_ft.indexOf(pk);
  let peak = '', avoid = [];
  if (pk > now) {
    const px = x(ip + 1), py = y(pk), anchor = px > W - 40 ? 'end' : px < 40 ? 'start' : 'middle';
    const text = `Peak ${f2(pk)}`, ly = py - 8;
    avoid = [textBox(text, px, ly, anchor, 7.2)];
    peak = `<circle data-testid="timeline-peak-dot" class="f-text" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4"/>`
      + `<text data-testid="timeline-peak" class="t-text halo" x="${px.toFixed(1)}" y="${ly.toFixed(1)}" font-size="12" font-weight="700" text-anchor="${anchor}">${text}</text>`;
  }
  g += zoneLabels(d.levels, y, 4, W - 4, H, top, bot, avoid) + peak;
  outer += `<text class="t-muted" x="27" y="${(8 + y(now) + 4).toFixed(1)}" font-size="11" text-anchor="end">${f2(now)}</text>`;
  const label = `Next 3 days: middle case from ${f2(now)} ft to ${f2(t.middle_ft[n - 1])} ft${pk > now ? `, peaking at ${f2(pk)} ft` : ''}, shaded range up to ${f2(Math.max(...all))} ft.`;
  return `<svg class="chart" data-testid="timeline" viewBox="0 0 334 204" role="img" aria-label="${esc(label)}"><g transform="translate(34,8)">${g}</g>${outer}</svg>`;
}

function rainHtml(d) {
  const r = d.rain_6h, n = d.timeline.middle_ft.length;
  const ymax = Math.max(0.4, ...r.wet);
  const x = h => 34 + h / n * 290, base = 58, hh = 50, yh = v => v / ymax * hh;
  let s = '';
  for (let h = 24; h < n; h += 24) s += `<line class="s-grid" x1="${x(h).toFixed(1)}" y1="4" x2="${x(h).toFixed(1)}" y2="62" stroke-width="1"/>`;
  r.middle.forEach((mid, j) => {
    const x0 = x(6 * j), x1 = x(Math.min(6 * j + 6, n)), w = (x1 - x0) * 0.75, bx = (x0 + (x1 - x0 - w) / 2).toFixed(1);
    const wet = r.wet[j] ?? 0;
    s += `<rect x="${bx}" y="${(base - yh(wet)).toFixed(1)}" width="${w.toFixed(1)}" height="${yh(wet).toFixed(1)}" rx="2" fill="#DCE8F8" class="s-water" stroke-width="1"/>`;
    s += `<rect data-testid="rain-bar" x="${bx}" y="${(base - yh(mid)).toFixed(1)}" width="${w.toFixed(1)}" height="${yh(mid).toFixed(1)}" rx="2" fill="#1F5FB8"/>`;
  });
  s += `<line class="s-axis" x1="34" y1="${base}" x2="324" y2="${base}" stroke-width="1"/>`;
  s += `<text class="t-muted" x="30" y="12" font-size="11" text-anchor="end">${+ymax.toFixed(2)}</text>`;
  s += `<text class="t-muted" x="30" y="62" font-size="11" text-anchor="end">0</text>`;
  const label = `Rain per 6 hours: middle case up to ${f2(Math.max(0, ...r.middle))} in, wet case up to ${f2(Math.max(0, ...r.wet))} in.`;
  return `<div data-testid="rain">`
    + `<div class="key" style="padding-left:34px"><b>Rain, in per 6 h</b> · <span><span class="sw" style="background:#1F5FB8"></span>middle</span> · <span><span class="sw" style="background:#DCE8F8;border:1px solid var(--water)"></span>wet</span></div>`
    + `<svg class="chart" viewBox="0 0 334 68" role="img" aria-label="${esc(label)}">${s}</svg></div>`;
}

function statusHtml(d) {
  const st = d.status, ob = st.observed_eap;
  let s = '';
  if (ob) {
    const color = /^#[0-9a-fA-F]{6}$/.test(ob.color) ? ob.color : '#7A1712';
    s += `<div class="status-row" style="background:${color}"><div class="lead">${ICON.octagon}<span>${esc(ob.title.toUpperCase())} · at ${f2(ob.gauge_ft)} ft</span></div></div>`;
  }
  if (st.rank >= 1) {
    s += `<div class="status-row" style="background:${LADDER[st.level] || '#7A1712'}"><div class="lead">${ICON.triangle}<span>${esc(st.level)}</span></div>`
      + (st.headline ? `<div class="head">${esc(st.headline)}</div>` : '') + `</div>`;
  }
  return s ? `<div class="status" data-testid="status">${s}</div>` : '';
}

function lakeHtml(d, normal) {
  const lk = d.lake, st = d.status, noForecast = d.mode === 'no_forecast';
  let tags = '';
  if (noForecast) tags = `<span class="tag grey" data-testid="no-forecast">No forecast</span>`;
  else if (st.rank === 0 && !st.observed_eap) tags = `<span class="tag ok" data-testid="normal">${ICON.check}Normal</span>`;
  const rate = lk.rain_rate_in_per_h == null ? 0 : Math.round(lk.rain_rate_in_per_h * 100) / 100;
  if (rate > 0) tags += `<span class="tag rain" data-testid="rain-now" aria-label="Raining ${f2(rate)} inches per hour">${ICON.drop}${f2(rate)} in/hr</span>`;
  let trend = '';
  if (lk.trend === 'steady') trend = 'steady';
  else if (lk.trend) trend = `${lk.trend === 'rising' ? ICON.up : ICON.down}${f2(Math.abs(lk.trend_ft_per_h))} ft/hr`;
  if (d.trend_change) trend += `<span data-testid="trend-change"> · ${esc(d.trend_change)}</span>`;
  let s = `<div class="row"><span class="caps">Lake now</span><span class="tags-now">${tags}</span></div>`
    + `<div class="row" style="align-items:baseline"><span class="now">${f2(lk.now_ft)} ft</span><span class="trend">${trend}</span></div>`;
  if (lk.problem) s += `<div class="flag" data-testid="gauge-flag">${ICON.flag}<span>Gauge: ${esc(lk.problem)}</span></div>`;
  if (!noForecast && d.cases) {
    if (normal) s += `<div class="peak"><span class="k">3-day peak</span><span class="v">${f2(d.cases.middle)} ft <span>(${f2(d.cases.dry)}–${f2(d.cases.wet)})</span></span></div>`;
    else s += stickSvg(d);
  }
  return `<section class="card" data-testid="lake" aria-label="Lake">${s}</section>`;
}

function rainForecastHtml(d) {
  const r = d.rain_total_in;
  return r ? `<span class="rain-total" data-testid="rain-forecast">Rain ${f2(r.middle)} in <span class="muted">(${f2(r.dry)}–${f2(r.wet)})</span></span>` : '';
}

function actionsHtml(d) {
  if (!d.actions || !d.actions.length) return '';
  let s = `<span class="caps" style="padding:0 4px">Do now</span>`
    + d.actions.map(a => `<div class="act">${actionIcon(a.id)}<span>${esc(a.short)}</span></div>`).join('');
  const nx = d.next_level;
  if (nx) {
    s += `<div class="next"><div class="next-h" data-testid="next-level">At ${f2(nx.gauge_ft)} ft</div>`
      + `<div class="tags">${nx.actions.map(a => `<span class="act-tag">${esc(a.short)}</span>`).join('')}</div></div>`;
  }
  return `<section class="card" data-testid="actions" aria-label="Do now">${s}</section>`;
}

function stopLogsHtml(d) {
  const sl = d.stop_logs;
  if (!sl) return '';
  const L = byKey(d.levels), opts = sl.options, n = opts.length;
  const top = Math.max(...opts.map(o => o.wet_ft), L.early_warning.stick_ft) + 0.15;
  const bot = Math.min(...opts.map(o => o.dry_ft)) - 0.15;
  // Zone labels in a left gutter; the right margin leaves room for the last middle label.
  // shortcut: past 4 options the middle labels crowd; fine for the 0-3 logs the dam takes.
  const W = 334, G = 72, col = (W - G - 28) / n, y = v => 16 + (top - v) / (top - bot) * 192;
  const caption = o => o.logs_in === sl.logs_in ? `Leave ${sl.logs_in}` : o.logs_in === 0 ? 'Pull all' : `Pull ${sl.logs_in - o.logs_in}`;
  let s = zones(L, y, 0, W, top, bot) + zoneLabels(d.levels, y, 4, W - 4, 208, top, bot);
  opts.forEach((o, i) => {
    const cx = G + col * (i + 0.5), ym = y(o.middle_ft);
    s += `<rect data-testid="option-bar" x="${(cx - 10).toFixed(1)}" y="${y(o.wet_ft).toFixed(1)}" width="20" height="${Math.max(2, y(o.dry_ft) - y(o.wet_ft)).toFixed(1)}" rx="4" class="f-water" fill-opacity="0.45"/>`;
    s += `<line class="s-text" x1="${(cx - 12).toFixed(1)}" y1="${ym.toFixed(1)}" x2="${(cx + 12).toFixed(1)}" y2="${ym.toFixed(1)}" stroke-width="3"/>`;
    s += `<text class="t-text halo" x="${(cx + 14).toFixed(1)}" y="${(ym + 4).toFixed(1)}" font-size="12" font-weight="700">${f2(o.middle_ft)}</text>`;
    s += `<text class="t-text" x="${cx.toFixed(1)}" y="230" font-size="14" font-weight="700" text-anchor="middle">${caption(o)}</text>`;
    s += `<text class="t-text" x="${cx.toFixed(1)}" y="254" font-size="18" font-weight="800" text-anchor="middle">${o.pct.overtop}%</text>`;
    s += `<text class="t-muted" x="${cx.toFixed(1)}" y="270" font-size="11" text-anchor="middle">overtop</text>`;
  });
  const label = '3-day peak range by option. '
    + opts.map(o => `${caption(o)}: ${f2(o.dry_ft)} to ${f2(o.wet_ft)} ft, middle ${f2(o.middle_ft)}, overtop ${o.pct.overtop}%.`).join(' ');
  return `<section class="card" data-testid="stop-logs" aria-label="Stop logs">`
    + `<div class="sl-h">Stop logs: ${sl.logs_in} in${sl.is_default ? ' (default)' : ''}</div>`
    + `<svg class="chart" viewBox="0 0 ${W} 276" role="img" aria-label="${esc(label)}">${s}</svg></section>`;
}


// ---- Details view (F9) ----
const detailsView = document.getElementById('details-view');
const detailsBtn = document.getElementById('details');
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + f2(Math.abs(v));
const hour12 = d => { const p = tzParts(d, { hour: 'numeric', hour12: true }); return `${p.hour} ${p.dayPeriod.toLowerCase()}`; };
const weekday = d => tzParts(d, { weekday: 'short' }).weekday;
const CHEVRON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
let showingDetails = false;

function section(id, title, body, open) {
  return `<section class="sec"><button type="button" class="sec-h" data-testid="${id}" aria-expanded="${open}" aria-controls="${id}-b">${title}${CHEVRON}</button>`
    + `<div class="sec-b" id="${id}-b"${open ? '' : ' hidden'}>${body}</div></section>`;
}

function factorsBody(d, x) {
  const max = Math.max(0.01, ...x.factors.map(f => Math.abs(f.ft)));
  const rows = x.factors.map(f => `<div class="frow" data-testid="factor"><div class="lab"><span>${esc(f.label)}</span><span>${sgn(f.ft)} ft</span></div>`
    + `<div class="bar" aria-hidden="true"><i class="${f.ft < 0 ? 'neg' : ''}" style="${f.ft < 0 ? 'right' : 'left'}:50%;width:${(Math.abs(f.ft) / max * 50).toFixed(1)}%"></i></div></div>`).join('');
  // A stale merge pairs the live lake with last-good's peak, so it shows no endpoints.
  const toPeak = x.factors_window === 'to peak';
  const net = d.unavailable ? (toPeak ? 'Net to peak' : 'Net over 3 days')
    : toPeak ? `Net ${f2(d.lake.now_ft)}→${f2(d.cases.middle)} ft` : 'Net over 3 days';
  // A stale answer's bars are from its forecast start, not now.
  const from = d.stale_since && d.timeline ? dayHour(new Date(d.timeline.start)) : 'now';
  const caption = toPeak && x.factors_until ? `Forecast, middle case · ${from} → peak ${dayHour(new Date(x.factors_until))}`
    : 'Forecast, middle case · next 3 days';
  return `<div class="fwin" data-testid="factors-window">${caption}</div>` + rows + `<div class="net" data-testid="net"><span>${net}</span><span>${sgn(x.net_ft)}</span></div>`;
}

function rainBody(x) {
  const days = x.rain_days, start = new Date(days[0].start);
  const head = days.map(r => `<th>${weekday(new Date(Date.parse(r.start) + 24 * 3600e3))}</th>`).join('');
  const row = (name, k) => `<tr><td>${name}</td>${days.map(r => `<td>${n1(r[k])}</td>`).join('')}</tr>`;
  return `<table class="d" data-testid="rain-table"><caption>in per day (${hour12(start)}–${hour12(start)})</caption>`
    + `<thead><tr><th></th>${head}</tr></thead><tbody>${row('Dry', 'dry_in')}${row('Middle', 'middle_in')}${row('Wet', 'wet_in')}</tbody></table>`;
}

function casesBody(d, x) {
  const when = (at, reached) => reached ? 'now' : at ? dayHour(new Date(at)) : 'no';
  const bridge = !!byKey(d.levels).bridge;
  const row = c => `<tr><td>${c.name[0].toUpperCase() + c.name.slice(1)}</td><td>${f2(d.cases[c.name])}</td>`
    + `<td>${when(c.overtop_at, c.overtop_reached)}</td>${bridge ? `<td>${when(c.bridge_at, c.bridge_reached)}</td>` : ''}</tr>`;
  return `<table class="d"><thead><tr><th></th><th>Peak</th><th>Overtops</th>${bridge ? '<th>Bridge</th>' : ''}</tr></thead><tbody>${x.cases.map(row).join('')}</tbody></table>`;
}

function dataBody(d, x) {
  const rows = [
    d.lake.problem ? `Lake gauge: ${d.lake.problem}`
      : x.gauge_age_min == null ? `Lake gauge: ${d.unavailable ? "can't reach" : 'unknown'}` : `Lake gauge: ${x.gauge_age_min} min ago`,
    `Rain gauge: ${n1(x.rain_gauge_24h_in)} in, last 24 h`,
    `Stop logs: ${x.stop_log_count}${x.stop_log_default ? ' (default)' : ''}`,
    `Rain forecast: ${x.rain_source === 'ensemble' && d.ensemble_cycle ? `ECMWF ${dayHour(new Date(d.ensemble_cycle))} run`
      : x.rain_source === 'point_forecast' ? 'Apple only' : 'none'}`,
    ...(x.agreement_pct == null ? [] : [`Agreement: ${x.agreement_label}, ${x.agreement_pct}% within ${f2(x.agreement_tol_ft)} ft`]),
    `Soil: ${x.soil_pct}% full`,
  ];
  return rows.map(r => `<div class="drow">${esc(r)}</div>`).join('');
}

function detailsHtml(d, open = {}) {
  const x = d.details;
  let s = `<div class="details-top"><button type="button" class="back" data-testid="back" id="back">Back</button>`
    + `<h2 data-testid="details-title">All details · ${d.example ? 'Example storm' : d.stale_since ? 'As of ' + clock(new Date(d.stale_since)) : 'Updated ' + clock(new Date(d.computed_at))}</h2></div>`
    + bannerHtml(d, 'details-banner');
  const secs = [];
  if (x.factors.length) secs.push(['sec-factors', "What will raise the lake", factorsBody(d, x)]);
  if (x.rain_days.length) secs.push(['sec-rain', 'Rain by day', rainBody(x)]);
  if (x.cases.length) secs.push(['sec-cases', 'Dry, middle and wet', casesBody(d, x)]);
  secs.push(['sec-data', 'Data and model', dataBody(d, x)]);
  s += secs.map(([id, t, b], i) => section(id, t, b, open[id] ?? i === 0)).join('');
  s += `<a class="tool" data-testid="tool-whatif" href="dashboard?mode=manual">What-if storm</a>`
    + `<a class="tool" data-testid="tool-backtest" href="dashboard?mode=backtest">Backtest: model vs gauge</a>`
    + (d.example ? `<a class="tool" data-testid="tool-live" href="./">Back to live</a>`
                 : `<a class="tool" data-testid="tool-example" href="?example=storm">Example storm</a>`);
  return s;
}

let summaryScroll = 0;
function setView(details) {
  if (details === showingDetails) return;
  if (details) summaryScroll = window.scrollY;
  showingDetails = details;
  main.hidden = details;
  detailsBtn.hidden = details;
  detailsView.hidden = !details;
  // The control that had focus is now hidden: hand focus to its counterpart.
  if (details) { document.getElementById('back').focus({ preventScroll: true }); window.scrollTo(0, 0); }
  else { detailsBtn.focus({ preventScroll: true }); window.scrollTo(0, summaryScroll); }
}

detailsView.addEventListener('click', e => {
  if (e.target.closest('#back')) return setView(false);
  const h = e.target.closest('.sec-h');
  if (!h) return;
  const open = h.getAttribute('aria-expanded') !== 'true';
  h.setAttribute('aria-expanded', open);
  document.getElementById(h.getAttribute('aria-controls')).hidden = !open;
});
detailsBtn.addEventListener('click', () => setView(true));

function bannerHtml(d, testid) {
  if (d.example) return `<div class="banner example" data-testid="${testid}"><span>Example storm<span class="sub">Not a real forecast</span></span><a href="./">Back to live</a></div>`;
  return d.unavailable ? `<div class="banner" data-testid="${testid}">As of ${hm(new Date(d.stale_since || d.computed_at))} — ${esc(d.unavailable)}</div>` : '';
}

let shownAt = null;   // computed_at of the summary on screen, once one has been drawn
function render(d) {
  for (const b of document.querySelectorAll('[data-testid=fetch-failed]')) b.remove();
  updated.textContent = d.example ? 'Example storm' : `Updated ${clock(new Date(d.computed_at))}`;
  if (d.example) document.title = 'Example storm · Crystal Lake';
  const st = d.status;
  const normal = st.rank === 0 && !st.observed_eap && d.levels.every(lv => !lv.pct);
  let s = '';
  s += bannerHtml(d, 'banner');
  s += statusHtml(d);
  s += lakeHtml(d, normal);
  if (d.timeline) {
    s += `<section class="card" aria-label="Next 3 days"><div class="row"><span class="caps">Next 3 days</span>${rainForecastHtml(d)}</div>${timelineSvg(d)}${d.rain_6h ? rainHtml(d) : ''}</section>`;
  }
  s += actionsHtml(d) + stopLogsHtml(d);
  main.innerHTML = s;
  if (d.details) {
    // A refresh leaves each Details section open or closed as the operator left it.
    const open = {};
    for (const h of detailsView.querySelectorAll('.sec-h')) open[h.dataset.testid] = h.getAttribute('aria-expanded') === 'true';
    detailsView.innerHTML = detailsHtml(d, open);
  }
  shownAt = d.computed_at;
}

// A failed refresh keeps the page and the view on screen and says how old they are.
function fetchFailed(message) {
  if (shownAt === null) return showError(message);
  const html = `<div class="banner" data-testid="fetch-failed">Can't refresh — showing ${clock(new Date(shownAt))}</div>`;
  for (const b of document.querySelectorAll('[data-testid=fetch-failed]')) b.remove();
  main.insertAdjacentHTML('afterbegin', html);
  detailsView.querySelector('.details-top')?.insertAdjacentHTML('afterend', html);
}

function showError(message) {
  shownAt = null;   // no summary on screen any more
  setView(false);
  main.innerHTML = `<section class="card" data-testid="error"><div class="err-title">${esc(message)}</div>`
    + `<button type="button" class="btn" id="retry">Try again</button></section>`;
  document.getElementById('retry').addEventListener('click', load);
}

async function load() {
  refreshBtn.setAttribute('aria-busy', 'true');
  try {
    let r;
    try { r = await fetch(EXAMPLE ? 'field/example' : 'field', { cache: 'no-store' }); } catch (e) { return fetchFailed(ERRORS[502]); }
    if (!r.ok) return fetchFailed(ERRORS[r.status] || ERRORS[502]);
    try {
      render(await r.json());
    } catch (e) {
      console.error('field: cannot draw the summary', e);   // never leave a blank page
      showError("Can't draw the forecast");
    }
  } finally {
    refreshBtn.removeAttribute('aria-busy');
  }
}

refreshBtn.addEventListener('click', load);
load();
</script>
</body>
</html>
